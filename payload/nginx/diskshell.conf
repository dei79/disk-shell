location ^~ /diskshell/ {
    # Defense in depth: terminal requests must not be written to access logs.
    access_log off;
    # The application accepts at most 50 MiB plus multipart framing. DSM's
    # nginx default would otherwise reject useful uploads at roughly 1 MiB.
    client_max_body_size 52m;
    # Do not allow a stalled request body to occupy an upload indefinitely.
    client_body_timeout 60s;
    proxy_pass http://127.0.0.1:16082;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
